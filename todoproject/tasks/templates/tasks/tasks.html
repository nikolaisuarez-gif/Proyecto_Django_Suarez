<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Tareas</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#0b1021] min-h-screen flex items-center justify-center p-4 font-sans antialiased">

    <!-- Card Principal -->
    <div class="w-full max-w-md bg-[#182238] rounded-2xl shadow-2xl overflow-hidden border border-slate-700/50">
        
        <!-- Header -->
        <div class="bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600 py-4 px-6 text-center">
            <h1 class="text-white text-xl font-bold flex items-center justify-center gap-2">
                <i class="fa-solid fa-list-check text-2xl"></i>
                Panel de Tareas
            </h1>
        </div>

        <!-- Contenido -->
        <div class="p-6">
            <div class="flex items-center gap-2 text-xs font-semibold text-slate-400 uppercase tracking-wider mb-8">
                <i class="fa-solid fa-bars-staggered"></i>
                <span>Listado de Actividades</span>
            </div>

            <div class="flex flex-col items-center justify-center py-6 text-slate-400/80">
                <i class="fa-solid fa-folder-open text-5xl mb-3 text-slate-500"></i>
                <p class="text-sm font-medium">No hay tareas registradas aún.</p>
            </div>
        </div>

        <!-- Footer -->
        <div class="bg-[#131b2e] py-3 px-6 text-center border-t border-slate-700/30">
            <p class="text-xs text-slate-400">
                Laboratorio 01 • <span class="bg-slate-700 text-slate-200 px-1.5 py-0.5 rounded text-[10px] font-mono">Django App</span>
            </p>
        </div>

    </div>

</body>
</html>
