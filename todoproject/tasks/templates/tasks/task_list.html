<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workspace Tasks</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#0f172a] min-h-screen flex items-center justify-center p-6 font-sans text-slate-200">

    <!-- Card Principal con efecto Glassmorphism -->
    <div class="w-full max-w-lg bg-slate-900/60 backdrop-blur-xl border border-slate-700/60 rounded-3xl p-8 shadow-[0_0_50px_rgba(0,0,0,0.5)] relative overflow-hidden">
        
        <!-- Elementos decorativos neón de fondo -->
        <div class="absolute -top-12 -right-12 w-32 h-32 bg-indigo-500/20 rounded-full blur-2xl pointer-events-none"></div>
        <div class="absolute -bottom-12 -left-12 w-32 h-32 bg-purple-500/20 rounded-full blur-2xl pointer-events-none"></div>

        <!-- Encabezado -->
        <div class="flex items-center justify-between pb-6 mb-6 border-b border-slate-800">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-indigo-600/30 border border-indigo-500/40 flex items-center justify-center text-indigo-400">
                    <i class="fa-solid fa-layer-group text-lg"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-white tracking-wide">Gestor de Tareas</h1>
                    <p class="text-xs text-slate-400">Laboratorio 01 • Django</p>
                </div>
            </div>
            <span class="px-3 py-1 text-xs font-semibold text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 rounded-full">
                0 Activas
            </span>
        </div>

        <!-- Cuerpo del listado -->
        <div class="space-y-4 my-8">
            <div class="p-8 text-center border border-dashed border-slate-800 rounded-2xl bg-slate-950/30">
                <div class="w-12 h-12 mx-auto mb-3 rounded-full bg-slate-800/50 flex items-center justify-center text-slate-500">
                    <i class="fa-solid fa-check-double text-xl"></i>
                </div>
                <h3 class="text-sm font-semibold text-slate-300">Sin tareas pendientes</h3>
                <p class="text-xs text-slate-500 mt-1">Tu lista está limpia por el momento.</p>
            </div>
        </div>

        <!-- Pie de tarjeta -->
        <div class="pt-4 border-t border-slate-800 flex items-center justify-between text-xs text-slate-500">
            <span class="flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                Servidor listo
            </span>
            <span class="font-mono text-[11px] text-slate-400">v1.0.0</span>
        </div>

    </div>

</body>
</html>
