<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Biblioteca{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#0b1120] text-slate-100 min-h-screen font-sans">

    <header class="border-b border-slate-800 bg-slate-950/70 backdrop-blur sticky top-0 z-10">
        <div class="max-w-5xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-indigo-600/20 border border-indigo-500/40 flex items-center justify-center text-indigo-400">
                    <i class="fa-solid fa-book text-lg"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold text-white tracking-wide">Biblioteca</h1>
                    <p class="text-xs text-slate-400">Lab 04 • Relaciones de modelos</p>
                </div>
            </div>
            <nav class="flex items-center gap-2 text-xs">
                <a href="{% url 'library:book_list' %}" class="px-3 py-1.5 rounded-lg border border-slate-700 bg-slate-800 text-slate-300 hover:text-white hover:border-indigo-500/50 transition-colors">
                    <i class="fa-solid fa-list mr-1"></i> Libros
                </a>
            </nav>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-6 py-8">
        {% block content %}{% endblock %}
    </main>

</body>
</html>
