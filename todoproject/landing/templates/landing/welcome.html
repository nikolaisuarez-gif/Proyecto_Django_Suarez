<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sesion1 • Plataforma Django</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#07090e] text-slate-100 min-h-screen flex flex-col justify-between font-sans selection:bg-cyan-500 selection:text-black overflow-x-hidden relative">

    <!-- Luces de fondo (Efecto Glow Ambiental) -->
    <div class="absolute top-0 left-1/4 w-96 h-96 bg-purple-600/15 rounded-full blur-[120px] pointer-events-none"></div>
    <div class="absolute bottom-0 right-1/4 w-96 h-96 bg-cyan-500/15 rounded-full blur-[120px] pointer-events-none"></div>

    <!-- Header Glass -->
    <header class="w-full px-8 py-5 flex justify-between items-center max-w-7xl mx-auto z-10">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-2xl bg-slate-900 border border-slate-800 flex items-center justify-center text-cyan-400 shadow-inner">
                <i class="fa-solid fa-terminal text-sm"></i>
            </div>
            <span class="text-xl font-black tracking-wider text-white uppercase">Sesion<span class="text-cyan-400">1</span></span>
        </div>
        
        <nav class="hidden md:flex items-center gap-2 p-1.5 rounded-full bg-slate-900/80 border border-slate-800/80 backdrop-blur-md text-xs font-semibold text-slate-400">
            <a href="#" class="px-4 py-2 rounded-full text-white bg-slate-800 transition-all">Inicio</a>
            <a href="#" class="px-4 py-2 rounded-full hover:text-white transition-all">Características</a>
            <a href="#" class="px-4 py-2 rounded-full hover:text-white transition-all">Contacto</a>
        </nav>
    </header>

    <!-- Hero Section Central -->
    <main class="max-w-4xl mx-auto px-6 py-12 text-center flex flex-col items-center justify-center my-auto z-10">
        
        <!-- Badge Flotante -->
        <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-slate-900/90 border border-cyan-500/30 text-[11px] text-cyan-300 mb-8 shadow-lg shadow-cyan-500/5">
            <i class="fa-brands fa-python text-sm text-cyan-400"></i>
            <span>Powered by Django Framework</span>
        </div>

        <h1 class="text-5xl md:text-7xl font-black text-white tracking-tight mb-6 leading-none">
            Bienvenido a <br>
            <span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-teal-300 to-indigo-500">
                Sesion1
            </span>
        </h1>

        <p class="text-slate-400 text-base md:text-lg max-w-lg mb-10 leading-relaxed font-normal">
            Tu nuevo entorno interactivo. El Framework web mas potente para Python, diseño moderno y limpio
        </p>

        <!-- Botones de Acción -->
        <div class="flex flex-col sm:flex-row items-center gap-4">
            <a href="#" class="w-full sm:w-auto px-8 py-4 rounded-xl bg-cyan-400 text-slate-950 font-extrabold text-sm hover:bg-cyan-300 transition-all shadow-[0_0_25px_rgba(34,211,238,0.3)] flex items-center justify-center gap-2">
                Comenzar ahora <i class="fa-solid fa-chevron-right text-xs"></i>
            </a>
            <a href="#" class="w-full sm:w-auto px-8 py-4 rounded-xl bg-slate-900/80 border border-slate-800 hover:border-slate-700 text-slate-300 hover:text-white font-bold text-sm transition-all flex items-center justify-center">
                Ver Documentación
            </a>
        </div>
    </main>

    <!-- Footer -->
    <footer class="py-6 text-center text-xs text-slate-600 z-10 border-t border-slate-900">
        <p>© 2026 Sesion1 • Entorno Independiente en Git Branch: <span class="text-slate-400 font-mono">landing-page</span></p>
    </footer>

</body>
</html>
