<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Toolkit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#090d16] text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-[#111827] border border-purple-500/20 rounded-3xl p-6 shadow-[0_0_40px_rgba(147,51,234,0.15)] relative">
        
        <!-- Header -->
        <div class="flex items-center justify-between mb-6 pb-4 border-b border-slate-800">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-purple-600/20 border border-purple-500/30 flex items-center justify-center text-purple-400">
                    <i class="fa-solid fa-calculator text-lg"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold text-white">Calculadora</h1>
                    <p class="text-xs text-purple-400 font-medium">Tarea • Operaciones Básicas</p>
                </div>
            </div>
            <a href="/" class="text-xs text-slate-400 hover:text-white transition-colors bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700">
                <i class="fa-solid fa-arrow-left mr-1"></i> Tareas
            </a>
        </div>

        <!-- Formulario de cálculo -->
        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs text-slate-400 mb-1 font-semibold">Número 1</label>
                    <input type="number" step="any" name="num1" value="{{ num1 }}" required
                        class="w-full bg-slate-900/80 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-purple-500 transition-colors">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1 font-semibold">Número 2</label>
                    <input type="number" step="any" name="num2" value="{{ num2 }}" required
                        class="w-full bg-slate-900/80 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-purple-500 transition-colors">
                </div>
            </div>

            <!-- Botones de Operación -->
            <label class="block text-xs text-slate-400 mb-1 font-semibold">Seleccionar Operación</label>
            <div class="grid grid-cols-4 gap-2">
                <button type="submit" name="operation" value="add" 
                    class="py-2.5 bg-purple-600/20 border border-purple-500/40 rounded-xl font-bold text-purple-300 hover:bg-purple-600 hover:text-white transition-all active:scale-95">
                    <i class="fa-solid fa-plus"></i>
                </button>
                <button type="submit" name="operation" value="subtract" 
                    class="py-2.5 bg-purple-600/20 border border-purple-500/40 rounded-xl font-bold text-purple-300 hover:bg-purple-600 hover:text-white transition-all active:scale-95">
                    <i class="fa-solid fa-minus"></i>
                </button>
                <button type="submit" name="operation" value="multiply" 
                    class="py-2.5 bg-purple-600/20 border border-purple-500/40 rounded-xl font-bold text-purple-300 hover:bg-purple-600 hover:text-white transition-all active:scale-95">
                    <i class="fa-solid fa-xmark"></i>
                </button>
                <button type="submit" name="operation" value="divide" 
                    class="py-2.5 bg-purple-600/20 border border-purple-500/40 rounded-xl font-bold text-purple-300 hover:bg-purple-600 hover:text-white transition-all active:scale-95">
                    <i class="fa-solid fa-divide"></i>
                </button>
            </div>
        </form>

        <!-- Pantalla de Resultado -->
        {% if result is not None %}
        <div class="mt-6 p-4 rounded-2xl bg-slate-900/90 border border-purple-500/30 text-center">
            <span class="text-xs uppercase tracking-wider text-purple-400 font-semibold block mb-1">Resultado Final</span>
            <div class="text-2xl font-mono font-bold text-white tracking-wide">
                {{ result }}
            </div>
        </div>
        {% endif %}

    </div>

</body>
</html>
